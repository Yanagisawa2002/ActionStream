[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "actionstream"
version = "1.1.0"
description = "Delay-aligned action-chunk inference backend and frozen robot-policy benchmark."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[xvla,libero,evaluation,async] @ https://github.com/huggingface/lerobot/archive/73e1584473028a2d53ecfc856f5290db84507f90.tar.gz",
  "torch>=2.7,<2.12.0",
  "torchvision>=0.22,<0.27.0",
]

[dependency-groups]
dev = [
  "matplotlib==3.11.1",
  "pytest==8.4.1",
  "ruff==0.14.1",
]

[project.urls]
Repository = "https://github.com/Yanagisawa2002/ActionStream"
Issues = "https://github.com/Yanagisawa2002/ActionStream/issues"

[project.scripts]
actionstream-preflight = "actionstream.preflight:main"
actionstream-benchmark = "actionstream.benchmark:main"
actionstream-results = "actionstream.results:main"
actionstream-rpc-server = "actionstream.rpc_server:main"
actionstream-rpc-matrix = "actionstream.rpc_matrix:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
required-version = "==0.11.32"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.uv.workspace]
members = ["integrations/lerobot"]
