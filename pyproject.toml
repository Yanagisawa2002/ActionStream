[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "actionstream"
version = "0.1.0"
description = "Delay-aware asynchronous action-chunk execution benchmark for X-VLA on LIBERO."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[xvla,libero,evaluation]==0.6.0",
]

[project.scripts]
actionstream-preflight = "actionstream.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
