[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "actionstream"
version = "1.1.0rc1"
description = "Delay-aligned action-chunk inference backend and frozen robot-policy benchmark."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[xvla,libero,evaluation,async] @ git+https://github.com/huggingface/lerobot.git@6adf51511b7625090eade8d82d9f61a1846ebe56",
]

[dependency-groups]
dev = [
  "matplotlib==3.11.1",
  "pytest==8.4.1",
  "ruff==0.14.1",
]

[project.urls]
Repository = "https://github.com/Yanagisawa2002/ActionStream"
Issues = "https://github.com/Yanagisawa2002/ActionStream/issues"

[project.scripts]
actionstream-preflight = "actionstream.preflight:main"
actionstream-benchmark = "actionstream.benchmark:main"
actionstream-results = "actionstream.results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
required-version = "==0.11.32"
