name: Public release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Strict technical and legal audit
        run: python scripts/release/audit_public_release.py
